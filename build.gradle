plugins {
	id 'java' // Needed for assemble and build
	id 'maven-publish' // Provides publishing and publishToMavenLocal
	id 'com.enonic.defaults' version '2.1.7' // Publishing
	id 'com.enonic.xp.app'
	id 'com.github.node-gradle.node' version '7.1.0'
}

repositories {
	mavenLocal()
	xp.enonicRepo('dev')
	mavenCentral()
}


dependencies {
	implementation xplibs.api.core
	implementation xplibs.api.portal

	//──────────────────────────────────────────────────────────────────────────
	// Core libs (com.enonic.xp)
	//──────────────────────────────────────────────────────────────────────────

	include xplibs.admin
	include xplibs.app
	include xplibs.auth
	include xplibs.cluster // src/main/resources/main.ts:import {isMaster} from '/lib/xp/cluster';
	include xplibs.common
	include xplibs.context // Needed by lib-explorer
	include xplibs.event
	include xplibs.i18n // Needed by lib-explorer
	include xplibs.io
	include xplibs.mail // Needed by lib-explorer
	include xplibs.node // Needed by lib-explorer
	include xplibs.portal
	include xplibs.project
	include xplibs.repo
	include xplibs.scheduler
	include xplibs.schema
	include xplibs.task
	//include xplibs.thymeleaf
	include xplibs.vhost
	include xplibs.websocket

	//──────────────────────────────────────────────────────────────────────────
	// Other enonic libs (com.enonic.lib)
	//──────────────────────────────────────────────────────────────────────────

	include libs.lib.cache
	include libs.lib.graphql
	include libs.lib.http.client
	include libs.lib.license
	include libs.lib.router
	include libs.lib.static
	include libs.lib.explorer

	// WARNING: Do NOT use include files, jar file will be missing dependencies!

	//──────────────────────────────────────────────────────────────────────────
	// Test (runs the JS on the real script engine, once per engine)
	//──────────────────────────────────────────────────────────────────────────

	testImplementation "com.enonic.xp:testing:${xpVersion}"
	testImplementation 'org.junit.jupiter:junit-jupiter:6.1.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'org.graalvm.polyglot:js:25.0.3'
}


tasks.withType(Copy) {
  includeEmptyDirs = false
}

node {
	download = true
	version = "${nodeVersion}"
}

sourceSets {
	main {
		resources { // Paths relative to src/main/resources
			exclude 'assets/**/*.svg'
		}
	}
}

npmInstall.args = ['--legacy-peer-deps']

tasks.register('npmCheck', NpmTask) {
	dependsOn npmInstall
	args = ['verify:types']
	environment = [
		'FORCE_COLOR': 'true',
	]
}
// Too many errors, so we skip this for now
// check.dependsOn npmCheck

tasks.register('npmTest', NpmTask) {
	dependsOn npmInstall
	args = ['test']
	environment = [
		'FORCE_COLOR': 'true',
	]
	inputs.dir 'src/main/resources'
	inputs.dir 'test'
	outputs.dir 'coverage'
}
// The lib-explorer files are not available on github, so tests can't run there yet.
// Also @enonic-types/lib-explorer is not available on npm yet, which also prevents tests from running on github.
// test.dependsOn npmTest

tasks.register('cleanCoverage', Delete) {
	delete 'coverage'
}
clean.dependsOn cleanCoverage

tasks.register('npmBuild', NpmTask) {
	args = [
		'run',
		'build'
	]
	dependsOn npmInstall
	environment = [
		'FORCE_COLOR': 'true',
		'LOG_LEVEL_FROM_GRADLE': gradle.startParameter.logLevel.toString(),
		'NODE_ENV': project.hasProperty('dev') || project.hasProperty('development') ? 'development' : 'production'
	]
	inputs.dir 'src/main/resources'
	outputs.dir 'build/resources/main' // processResources will delete the directory if this is not present
}
jar.dependsOn npmBuild
javadoc.dependsOn npmBuild

processResources {
	exclude '**/.gitkeep'

	// We want these:
	// * collectors.json
	// * documentTypes.json
	// But not these:
	exclude 'tsconfig.json'
	exclude 'assets/tsconfig.json'

	// Let tsup/vite handle these (rather than gradle)
	exclude '**/*.css'
	exclude '**/*.es'
	exclude '**/*.js'
	exclude '**/*.jsx'
	exclude '**/*.less'
	exclude '**/*.sass'
	exclude '**/*.scss'
	exclude '**/*.styl'
	exclude '**/*.ts'
	exclude '**/*.tsx'
}

tasks.register('compressAssets', NpmTask) {
	dependsOn npmBuild
	dependsOn processResources
	args = ['run', 'compress:assets']
	environment = [
		'FORCE_COLOR': 'true',
	]
	inputs.dir 'build/resources/main/assets'
	outputs.dir 'build/resources/main/assets'
}
// TODO: Use if switch to lib-asset
// jar.dependsOn compressAssets

// The JS tests run the compiled bundle on the real engine, so it must exist on
// build/resources/main before the test sources are compiled and executed.
tasks.named('compileTestJava') {
	dependsOn npmBuild
}

test {
	dependsOn npmBuild
	useJUnitPlatform()
}

def testGraalJs = tasks.register('testGraalJs', Test) {
	group = 'verification'
	description = 'Runs tests with the GraalJS script engine.'
	dependsOn npmBuild
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	systemProperty 'xp.script-engine', 'GraalJS'
	shouldRunAfter test
}

check.dependsOn testGraalJs
